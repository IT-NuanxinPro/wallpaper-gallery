name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/pake-auth-navigation.js"
      - "public/favicon.svg"
      - ".github/workflows/desktop-release.yml"

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  desktop:
    name: Build macOS / Windows / Linux
    uses: IT-NuanxinPro/Pake/.github/workflows/wallpaper-gallery.yaml@main
    permissions:
      contents: write
    with:
      source_repository: ${{ github.repository }}
      source_ref: main
      release_tag: desktop
      url: "https://wallpaper.061129.xyz/"
      width: 1600
      height: 900
