name: Deploy to Cloudflare Pages
run-name: ${{ inputs.publication_id && format('video:{0}:{1}', inputs.publication_id, inputs.minimum_data_ref) || format('deploy:{0}:{1}', github.event_name, github.run_number) }}

on:
  push:
    branches: [main]
  schedule:
    # 每天北京时间凌晨 02:00 自动运行一次 (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      publication_id:
        description: Video publication identifier
        required: false
        type: string
      minimum_data_ref:
        description: Minimum image repository commit SHA to include
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  queue: max
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # concurrency执行权取得后才解析main，旧发布重试也使用此刻最新前端。
      - name: Checkout latest frontend main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Record exact frontend revision
        run: echo "FRONTEND_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare and validate latest complete data snapshot
        id: snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN || github.token }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
          MINIMUM_DATA_REF: ${{ inputs.minimum_data_ref }}
        run: node scripts/prepare-deploy-data.js

      - name: Update static CDN tag independently
        env:
          CDN_VERSION: ${{ steps.snapshot.outputs.cdn_version }}
        run: sed -i "s/export const CDN_VERSION = '[^']*'/export const CDN_VERSION = '$CDN_VERSION'/" src/utils/config/constants.js

      - name: Test
        run: pnpm test

      - name: Refresh recent hot tags from deployed metadata
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node scripts/export-stats.js
          pnpm export:hot-tags

      - name: Build
        env:
          VITE_DATA_REVISION: ${{ steps.snapshot.outputs.data_sha }}
          VITE_DOWNLOAD_PROTECTION_ENABLED: ${{ vars.VITE_DOWNLOAD_PROTECTION_ENABLED || 'false' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build:seo

      # 构建完成后才写资产；视频发布禁止removed，其余部署延续完整快照差集处理。
      - name: Sync wallpaper assets to Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WALLPAPER_ASSET_REMOVAL_POLICY: ${{ inputs.publication_id && 'upsert-only' || 'mark-missing' }}
        run: pnpm sync:assets

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=wallpaper-gallery-prod --branch=main --commit-hash=${{ env.FRONTEND_SHA }} --commit-message="${{ steps.snapshot.outputs.deployment_marker }}"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact successful Pages deployment
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/record-pages-deployment.js

      - name: Record successful video publication
        if: success() && inputs.publication_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: video-publication-result
          path: .deployment/result/publication-result.json
          if-no-files-found: error
          retention-days: 30
