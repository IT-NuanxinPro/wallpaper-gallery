name: Publish Version Release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "docs/releases/**"
      - ".github/workflows/release-version.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          NOTES_FILE="docs/releases/${TAG}.md"

          test -f "$NOTES_FILE" || {
            echo "Missing release notes: $NOTES_FILE"
            exit 1
          }

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES_FILE: ${{ steps.version.outputs.notes_file }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Wallpaper Gallery ${TAG}" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Wallpaper Gallery ${TAG}" \
              --notes-file "$NOTES_FILE"
          fi

          echo "Published Wallpaper Gallery ${TAG}"
